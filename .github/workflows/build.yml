name: Build and package Andiya

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            qt_arch: win64_msvc2022_64
          - os: ubuntu-22.04
            qt_arch: linux_gcc_64
          - os: macos-14
            qt_arch: clang_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: 6.8.3
          host: ${{ runner.os == 'Windows' && 'windows' || runner.os == 'macOS' && 'mac' || 'linux' }}
          arch: ${{ matrix.qt_arch }}
          target: desktop
          modules: qtmultimedia
          cache: true
      - name: Install Linux build tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build dpkg-dev
      - name: Build, verify, and package
        shell: bash
        run: |
          options=()
          if [ "$RUNNER_OS" = "Windows" ]; then
            options+=(--archive-only)
          fi
          set +e
          python -B tools/setup.py --qt-prefix "$QT_ROOT_DIR" \
            --build-dir "$RUNNER_TEMP/andiya-build" --package "${options[@]}" \
            2>&1 | tee "$RUNNER_TEMP/andiya-setup.log"
          result=${PIPESTATUS[0]}
          set -e
          if [ "$result" -ne 0 ]; then
            python -c 'import os,pathlib; s=(pathlib.Path(os.environ["RUNNER_TEMP"])/"andiya-setup.log").read_text(errors="replace")[-3500:]; print("::error::"+s.replace("%","%25").replace("\r","%0D").replace("\n","%0A"))'
            exit "$result"
          fi
      - name: Upload verification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Andiya-verification-${{ runner.os }}
          path: ${{ runner.temp }}/andiya-build/verification/
          if-no-files-found: ignore
      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: Andiya-${{ runner.os }}
          path: |
            ${{ runner.temp }}/andiya-build/packages/*
            !${{ runner.temp }}/andiya-build/packages/_CPack_Packages
            !${{ runner.temp }}/andiya-build/packages/_CPack_Packages/**
          compression-level: 0
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Andiya-Windows
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: Andiya-macOS
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: Andiya-Linux
          path: dist
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          fail_on_unmatched_files: true
          body: |
            CI-built packages for Windows, macOS, and Linux.

            - **Windows:** portable ZIP (unsigned). The NSIS installer is not included in this CI upload.
            - **macOS:** ad-hoc signed `.dmg` for Apple Silicon. Gatekeeper will warn until Developer ID signing and notarization.
            - **Linux:** `.tar.gz` and `.deb` for x86_64 (glibc 2.35+).

            These packages were produced by the same setup helper used for local packaging on windows-2022, ubuntu-22.04, and macos-14.
